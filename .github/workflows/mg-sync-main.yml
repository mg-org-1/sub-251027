name: 同步mg主库

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 授予必要权限（GITHUB_TOKEN 自动获得 contents + workflows 权限）
permissions:
  contents: write

jobs:
  sync-nodes:
    runs-on: ubuntu-latest
    steps:

      # 检出主仓库（使用默认 GITHUB_TOKEN，不指定 token）
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便 merge
          lfs: false

      # 配置 Git 使用 GITHUB_TOKEN 进行推送（关键！）
      - name: Configure Git credentials for push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 将 origin URL 改为带 GITHUB_TOKEN 的 HTTPS 格式
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Disable Git LFS globally
        run: git config --global filter.lfs.smudge "cat"

      # 设置 Python 环境
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run sync script
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          
          git remote add upstream https://github.com/mg-org-1/ComfyUI.git 2>/dev/null || true
          git fetch upstream
          git checkout master
          
          # === 备份本地关键文件 ===
          LOCAL_README_EXIST=0
          [ -f "README.md" ] && { cp README.md /tmp/README.md.backup; LOCAL_README_EXIST=1; }
          
          LOCAL_WORKFLOWS_EXIST=0
          [ -d ".github/workflows" ] && { cp -r .github/workflows /tmp/workflows.backup; LOCAL_WORKFLOWS_EXIST=1; }
          
          # === 清理 .gitattributes 中的 LFS 规则 ===
          if [ -f ".gitattributes" ]; then
            cp .gitattributes /tmp/gitattributes.backup
            grep -v 'filter=lfs' /tmp/gitattributes.backup > .gitattributes.new
            mv .gitattributes.new .gitattributes
            git add .gitattributes
          fi
          
          # === 合并上游 ===
          if ! git merge --no-ff --no-commit upstream/master; then
            echo "Merge conflict detected. Taking upstream version for all files..."
            git checkout --theirs .
            git add .
          fi
          
          # === 恢复本地文件 ===
          if [ "$LOCAL_README_EXIST" = "1" ]; then
            cp /tmp/README.md.backup README.md
            git add README.md
          fi
          
          if [ "$LOCAL_WORKFLOWS_EXIST" = "1" ]; then
            rm -rf .github/workflows
            cp -r /tmp/workflows.backup .github/workflows
            git add .github/workflows
          fi
          
          # 清理空目录
          if [ -d ".github" ] && [ -z "$(ls -A .github 2>/dev/null)" ]; then
            rmdir .github
            git add -A
          fi
          
          git add -A
          
          if ! git diff --cached --quiet; then
            git commit -m "Sync with upstream/master and restore local files (README.md, .github/workflows)"
            
            # === 关键修复：禁用 LFS 推送行为 ===
            git config lfs.disable true
            
            git push origin master
          else
            echo "No changes to commit."
          fi
